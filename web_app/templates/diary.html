<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日记管理 - 个性化旅游系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body class="diary-page">
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="/" class="logo">
                <i class="fas fa-map-marked-alt"></i> 个性化旅游系统
            </a>
            <ul class="nav-links">
                <li><a href="/" class="home-link"><i class="fas fa-home"></i> 首页</a></li>
                <li><a href="/recommend"><i class="fas fa-star"></i> 旅游推荐</a></li>
                <li><a href="/diary"><i class="fas fa-book"></i> 日记管理</a></li>
                <li id="user-links">
                    <a href="/login"><i class="fas fa-sign-in-alt"></i> 登录</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 页面标题 -->
    <section class="page-header">
        <div class="container">
            <h1>日记管理</h1>
            <p>记录您的旅游经历</p>
        </div>
    </section>

    <!-- 内容区 -->
    <section class="content">
        <div class="container">
            <div class="diary-container">
                <!-- 日记表单 -->
                <div class="diary-form">
                    <h2>创建/编辑日记</h2>
                    <input type="hidden" id="diary-id">
                    <div class="form-group">
                        <label>标题:</label>
                        <input type="text" id="diary-title" placeholder="请输入日记标题">
                    </div>
                    <div class="form-group">
                        <label>内容:</label>
                        <textarea id="diary-content" placeholder="请输入日记内容"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="saveDiary()"
                        style="width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s; background-color: #3498db; color: white;">保存日记</button>
                    <button class="btn btn-secondary" onclick="clearForm()"
                        style="width: 100%; margin-top: 10px; padding: 12px; border: 1px solid #3498db; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s; background-color: white; color: #3498db;">清空</button>
                </div>

                <!-- 日记列表 -->
                <div class="diary-list">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2>我的日记</h2>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-secondary" onclick="exportDiary()"><i class="fas fa-download"></i>
                                导出日记</button>
                            <input type="file" id="import-file" style="display: none;" accept=".json">
                            <button class="btn btn-primary" onclick="document.getElementById('import-file').click()"><i
                                    class="fas fa-upload"></i> 导入日记</button>
                            <button class="btn btn-warning" onclick="downloadAllVideos()"
                                style="background-color: #e67e22; color: white;"><i class="fas fa-sync"></i>
                                下载所有视频url</button>
                        </div>
                    </div>
                    <div id="loading" class="loading" style="display: none;">
                        <i class="fas fa-spinner"></i>
                        <p>加载中...</p>
                    </div>
                    <div id="diary-items"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        let currentDiaryId = null;

        // 页面加载时获取日记列表和登录状态
        window.onload = function () {
            checkLoginStatus();
            fetchDiaries();
        };

        // 检查用户登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/user/status');
                const data = await response.json();
                const userLinks = document.getElementById('user-links');

                if (data.logged_in) {
                    userLinks.innerHTML = `
                        <span style="margin-right: 15px; color: #3498db; font-weight: 500; display: inline-block; vertical-align: middle;">欢迎，${data.user_name}</span>
                        <a href="/logout" style="display: inline-block; vertical-align: middle;"><i class="fas fa-sign-out-alt"></i> 退出</a>
                    `;
                } else {
                    userLinks.innerHTML = `
                        <a href="/login" style="display: inline-block; vertical-align: middle;"><i class="fas fa-sign-in-alt"></i> 登录</a>
                        <a href="/register" style="margin-left: 10px; display: inline-block; vertical-align: middle;"><i class="fas fa-user-plus"></i> 注册</a>
                    `;
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
        }

        async function fetchDiaries() {
            const loading = document.getElementById('loading');
            const items = document.getElementById('diary-items');

            loading.style.display = 'block';

            try {
                const response = await fetch('/api/diary');
                const diaries = await response.json();

                loading.style.display = 'none';

                if (diaries.length > 0) {
                    items.innerHTML = diaries.map(diary => {
                        const hasVideos = diary.videos && diary.videos.length > 0;
                        const videoBtn = hasVideos
                            ? `<button class="btn btn-primary" onclick="showVideo(${diary.id})" style="padding: 8px 16px; font-size: 14px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;"><i class="fas fa-play"></i> 查看AI视频</button>`
                            : `<button class="btn btn-primary" onclick="generateVideo(${diary.id})" style="padding: 8px 16px; font-size: 14px; background-color: #9b59b6; color: white; border: none; border-radius: 4px; cursor: pointer;"><i class="fas fa-video"></i> 生成AI视频</button>`;

                        return `
                        <div class="diary-item" data-id="${diary.id}">
                            <div class="diary-header">
                                <h3>${diary.title}</h3>
                                <div class="diary-actions">
                                    <button class="btn btn-secondary" onclick="editDiary(${diary.id})">编辑</button>
                                    <button class="btn btn-danger" onclick="deleteDiary(${diary.id})">删除</button>
                                    ${videoBtn}
                                </div>
                            </div>
                            <div class="diary-meta">
                                <i class="fas fa-clock"></i> ${diary.created_at || new Date().toLocaleString()}
                                ${hasVideos ? `<span style="margin-left: 15px; color: #27ae60;"><i class="fas fa-check-circle"></i> 已生成AI视频</span>` : ''}
                            </div>
                            <div class="diary-content">
                                ${diary.content.substring(0, 100)}${diary.content.length > 100 ? '...' : ''}
                            </div>
                            <div class="video-section" id="video-section-${diary.id}" style="display: none; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px;"></div>
                        </div>
                        `;
                    }).join('');
                } else {
                    items.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 50px;">暂无日记，开始创建吧！</p>';
                }
            } catch (error) {
                console.error('获取日记列表失败:', error);
                loading.style.display = 'none';
                items.innerHTML = '<p style="text-align: center; color: #e74c3c; padding: 50px;">获取日记失败，请重试</p>';
            }
        }

        async function saveDiary() {
            const title = document.getElementById('diary-title').value;
            const content = document.getElementById('diary-content').value;

            if (!title || !content) {
                alert('请填写标题和内容');
                return;
            }

            try {
                if (currentDiaryId) {
                    // 更新日记
                    await fetch('/api/diary', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            id: currentDiaryId,
                            title,
                            content
                        })
                    });
                } else {
                    // 创建日记
                    await fetch('/api/diary', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            title,
                            content
                        })
                    });
                }

                clearForm();
                fetchDiaries();
            } catch (error) {
                console.error('保存日记失败:', error);
                alert('保存日记失败，请重试');
            }
        }

        function editDiary(id) {
            const diaryItem = document.querySelector(`.diary-item[data-id="${id}"]`);
            if (diaryItem) {
                const title = diaryItem.querySelector('h3').textContent;
                const content = diaryItem.querySelector('.diary-content').textContent.replace('...', '');

                document.getElementById('diary-id').value = id;
                document.getElementById('diary-title').value = title;
                document.getElementById('diary-content').value = content;

                currentDiaryId = id;
            }
        }

        async function deleteDiary(id) {
            if (confirm('确定要删除这篇日记吗？')) {
                try {
                    await fetch(`/api/diary?id=${id}`, {
                        method: 'DELETE'
                    });
                    fetchDiaries();
                } catch (error) {
                    console.error('删除日记失败:', error);
                    alert('删除日记失败，请重试');
                }
            }
        }

        function clearForm() {
            document.getElementById('diary-id').value = '';
            document.getElementById('diary-title').value = '';
            document.getElementById('diary-content').value = '';
            currentDiaryId = null;
        }

        // 导出日记
        async function exportDiary() {
            try {
                const response = await fetch('/api/diary/export');
                const data = await response.json();

                // 创建JSON文件并下载
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `diary_export_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('导出日记失败:', error);
                alert('导出日记失败，请重试');
            }
        }

        // 导入日记
        document.getElementById('import-file').addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const reader = new FileReader();
                reader.onload = async function (event) {
                    try {
                        const data = JSON.parse(event.target.result);
                        const response = await fetch('/api/diary/import', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });
                        const result = await response.json();

                        if (result.success) {
                            alert(`成功导入 ${result.imported} 篇日记`);
                            fetchDiaries();
                        } else {
                            alert('导入失败: ' + (result.error || '未知错误'));
                        }
                    } catch (error) {
                        console.error('解析JSON文件失败:', error);
                        alert('请选择有效的JSON文件');
                    }
                };
                reader.readAsText(file);
            } catch (error) {
                console.error('导入日记失败:', error);
                alert('导入日记失败，请重试');
            }
        });

        async function generateVideo(diaryId) {
            const videoSection = document.getElementById(`video-section-${diaryId}`);

            if (videoSection.style.display === 'none') {
                videoSection.style.display = 'block';
                videoSection.innerHTML = '<div style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #9b59b6;"></i><p style="margin-top: 10px; color: #7f8c8d;">正在提交视频生成任务...</p></div>';

                try {
                    const response = await fetch('/api/video/generate/ai', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ diary_id: diaryId, aspect_ratio: '16:9' })
                    });

                    const result = await response.json();

                    if (result.success && result.task_id) {
                        videoSection.innerHTML = '<div style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #9b59b6;"></i><p style="margin-top: 10px; color: #7f8c8d;">视频生成中，请稍候（通常需要1-2分钟）...</p><p style="color: #95a5a6; font-size: 12px; margin-top: 5px;">任务ID: ' + result.task_id.substring(0, 10) + '...</p></div>';
                        await pollVideoStatus(result.task_id, diaryId, videoSection);
                    } else {
                        let errorMsg = result.error || '未知错误';
                        let hint = '提示：请确保已正确配置火山引擎API密钥';
                        if (result.code === 50430) {
                            errorMsg = 'API并发限制';
                            hint = '提示：即梦3.0通常限制并发任务数量，请等待其他任务完成后重试';
                        }
                        videoSection.innerHTML = `
                            <div style="text-align: center; padding: 20px; color: #e74c3c;">
                                <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
                                <h4>任务提交失败</h4>
                                <p style="color: #7f8c8d; margin-top: 10px;">${errorMsg}</p>
                                <p style="color: #95a5a6; font-size: 12px; margin-top: 15px;">${hint}</p>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error('提交视频任务失败:', error);
                    videoSection.innerHTML = `
                        <div style="text-align: center; padding: 20px; color: #e74c3c;">
                            <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
                            <h4>提交失败</h4>
                            <p style="color: #7f8c8d; margin-top: 10px;">网络错误，请检查网络连接</p>
                        </div>
                    `;
                }
            } else {
                videoSection.style.display = 'none';
            }
        }

        async function pollVideoStatus(taskId, diaryId, videoSection) {
            const maxAttempts = 60;
            let attempts = 0;

            while (attempts < maxAttempts) {
                try {
                    const response = await fetch('/api/video/query/ai', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ task_id: taskId, diary_id: diaryId })
                    });

                    const result = await response.json();

                    if (result.success) {
                        if (result.status === 'completed' && result.video_url) {
                            displayAIVideo(videoSection, result);
                            return;
                        } else if (result.status === 'failed') {
                            videoSection.innerHTML = `
                                <div style="text-align: center; padding: 20px; color: #e74c3c;">
                                    <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
                                    <h4>视频生成失败</h4>
                                    <p style="color: #7f8c8d; margin-top: 10px;">${result.error || '未知错误'}</p>
                                </div>
                            `;
                            return;
                        }
                    } else {
                        videoSection.innerHTML = `
                            <div style="text-align: center; padding: 20px; color: #e74c3c;">
                                <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
                                <h4>查询失败</h4>
                                <p style="color: #7f8c8d; margin-top: 10px;">${result.error || '未知错误'}</p>
                            </div>
                        `;
                        return;
                    }
                } catch (error) {
                    console.error('查询视频状态失败:', error);
                }

                attempts++;
                const progress = Math.min(Math.round((attempts / maxAttempts) * 100), 95);
                videoSection.innerHTML = `<div style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #9b59b6;"></i><p style="margin-top: 10px; color: #7f8c8d;">视频生成中，请稍候（通常需要1-2分钟）...</p><div style="margin-top: 15px; width: 200px; margin-left: auto; margin-right: auto;"><div style="background-color: #ecf0f1; border-radius: 4px; height: 8px; overflow: hidden;"><div style="background-color: #9b59b6; height: 100%; width: ${progress}%; transition: width 0.5s;"></div></div></div><p style="color: #95a5a6; font-size: 12px; margin-top: 10px;">任务ID: ${taskId.substring(0, 10)}... | 第 ${attempts} 次查询</p></div>`;
                await new Promise(resolve => setTimeout(resolve, 5000));
            }

            videoSection.innerHTML = `
                <div style="text-align: center; padding: 20px; color: #e67e22;">
                    <i class="fas fa-clock" style="font-size: 48px; margin-bottom: 15px;"></i>
                    <h4>视频生成超时</h4>
                    <p style="color: #7f8c8d; margin-top: 10px;">视频生成时间较长，请稍后手动刷新页面查看</p>
                    <button onclick="pollVideoStatus('${taskId}', '${diaryId}', this.parentElement.parentElement)" style="margin-top: 15px; padding: 8px 16px; background-color: #9b59b6; color: white; border: none; border-radius: 4px; cursor: pointer;">重新查询</button>
                </div>
            `;
        }

        function displayAIVideo(container, result) {
            const videoUrl = result.video_url || '';
            const diaryTitle = result.diary_title || result.prompt || '日记内容';
            const prompt = result.prompt || '';
            const generatedAt = result.generated_at || new Date().toLocaleString();

            let html = `
                <div style="margin-bottom: 15px;">
                    <h4 style="margin-bottom: 10px; color: #2c3e50;"><i class="fas fa-magic" style="color: #9b59b6;"></i> 即梦AI生成视频</h4>
                    <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 15px;">
                        基于日记内容生成的AI视频
                    </p>
                </div>
                <div style="background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <div style="margin-bottom: 10px;">
                        <span style="background: #9b59b6; color: white; padding: 3px 10px; border-radius: 3px; font-size: 12px;">
                            <i class="fas fa-check-circle"></i> 生成成功
                        </span>
                        <span style="margin-left: 10px; color: #95a5a6; font-size: 12px;">
                            生成时间: ${generatedAt}
                        </span>
                    </div>
                    <video width="100%" controls style="border-radius: 8px; margin-bottom: 10px; background: #000;">
                        <source src="${encodeURI(videoUrl)}" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                    <div style="margin-top: 10px; text-align: center;">
                        <a href="${encodeURI(videoUrl)}" target="_blank" style="color: #3498db; text-decoration: none; font-size: 14px;">
                            <i class="fas fa-external-link-alt"></i> 在新窗口打开视频
                        </a>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        async function showVideo(diaryId) {
            const videoSection = document.getElementById(`video-section-${diaryId}`);

            if (videoSection.style.display === 'none') {
                videoSection.style.display = 'block';

                try {
                    const response = await fetch('/api/diary/' + diaryId);
                    const diary = await response.json();

                    if (diary.videos && diary.videos.length > 0) {
                        const latestVideo = diary.videos[diary.videos.length - 1];
                        displaySavedVideo(videoSection, latestVideo, diaryId);
                    } else {
                        videoSection.innerHTML = '<p style="text-align: center; color: #7f8c8d;">暂无已生成的视频</p>';
                    }
                } catch (error) {
                    console.error('获取日记视频失败:', error);
                    videoSection.innerHTML = '<p style="text-align: center; color: #e74c3c;">获取视频失败</p>';
                }
            } else {
                videoSection.style.display = 'none';
            }
        }

        function displaySavedVideo(container, video, diaryId) {
            const videoUrl = video.video_url || '';
            const generatedAt = video.generated_at || '';
            const prompt = video.prompt || '';
            const isLocal = videoUrl.startsWith('/static/');

            let html = `
                <div style="margin-bottom: 15px;">
                    <h4 style="margin-bottom: 10px; color: #2c3e50;"><i class="fas fa-play-circle" style="color: #27ae60;"></i> AI生成视频</h4>
                </div>
                <div style="background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <div style="margin-bottom: 10px;">
                        <span style="background: #27ae60; color: white; padding: 3px 10px; border-radius: 3px; font-size: 12px;">
                            <i class="fas fa-check-circle"></i> 已保存
                        </span>
                        <span style="margin-left: 10px; color: #95a5a6; font-size: 12px;">
                            生成时间: ${generatedAt}
                        </span>
                        ${!isLocal ? `
                            <button onclick="downloadVideo(${diaryId})" style="margin-left: 15px; padding: 3px 10px; background-color: #e67e22; color: white; border: none; border-radius: 3px; font-size: 12px; cursor: pointer;">
                                <i class="fas fa-download"></i> 下载视频
                            </button>
                        ` : ''}
                    </div>
                    <video width="100%" controls style="border-radius: 8px; margin-bottom: 10px; background: #000;">
                        <source src="${encodeURI(videoUrl)}" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                    <div style="margin-top: 10px; text-align: center;">
                        <a href="${encodeURI(videoUrl)}" target="_blank" style="color: #3498db; text-decoration: none; font-size: 14px;">
                            <i class="fas fa-external-link-alt"></i> 在新窗口打开视频
                        </a>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        async function downloadVideo(diaryId) {
            if (!confirm('正在下载视频，请稍候...')) return;

            try {
                const response = await fetch('/api/video/download/video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ diary_id: diaryId, video_index: 0 })
                });

                const result = await response.json();

                if (result.success) {
                    if (result.already_local) {
                        alert('该视频已是本地视频，无需下载');
                    } else {
                        alert('视频下载成功！');
                    }
                    showVideo(diaryId);
                } else {
                    alert('视频下载失败: ' + (result.error || 'URL可能已过期'));
                }
            } catch (error) {
                console.error('下载视频失败:', error);
                alert('下载视频失败，请重试');
            }
        }

        async function downloadAllVideos() {
            if (!confirm('确定要下载所有远程视频吗？请耐心等待...')) return;

            try {
                const response = await fetch('/api/video/download/all-videos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.success) {
                    if (result.no_need) {
