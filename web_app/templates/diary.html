<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日记社区 - 个性化旅游系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .login-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .login-modal-box {
            background: white;
            border-radius: 12px;
            padding: 32px 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-modal-icon {
            font-size: 48px;
            color: #f39c12;
            margin-bottom: 16px;
        }

        .login-modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .login-modal-desc {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 24px;
        }

        .login-modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .login-modal-btn-primary {
            padding: 10px 28px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-modal-btn-primary:hover {
            background: #2980b9;
        }

        .login-modal-btn-cancel {
            padding: 10px 28px;
            background: #ecf0f1;
            color: #7f8c8d;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-modal-btn-cancel:hover {
            background: #dde4e6;
        }

        /* 点赞按钮样式 */
        .like-btn {
            padding: 6px 14px;
            border: 1px solid #e74c3c;
            border-radius: 20px;
            background: white;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .like-btn:hover {
            background: #fdf2f2;
            transform: scale(1.05);
        }

        .like-btn.liked {
            background: #e74c3c;
            color: white;
        }

        .like-btn.liked:hover {
            background: #c0392b;
        }

        /* 评论区域 */
        .comment-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }

        .comment-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .comment-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-user {
            font-weight: 600;
            color: #2c3e50;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .comment-user .is-author {
            background: #3498db;
            color: white;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 4px;
        }

        .comment-content {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        .comment-time {
            color: #95a5a6;
            font-size: 11px;
            margin-top: 3px;
        }

        .comment-delete-btn {
            background: none;
            border: none;
            color: #bdc3c7;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            transition: color 0.2s;
        }

        .comment-delete-btn:hover {
            color: #e74c3c;
        }

        .comment-input-row {
            display: flex;
            gap: 8px;
        }

        .comment-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .comment-input:focus {
            border-color: #3498db;
        }

        .comment-submit-btn {
            padding: 8px 18px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .comment-submit-btn:hover {
            background: #2980b9;
        }

        /* 日记作者标签 */
        .author-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .author-badge.self {
            background: #eaf4ff;
            color: #3498db;
        }

        .author-badge.other {
            background: #fef5e7;
            color: #e67e22;
        }

        /* 排序按钮样式 */
        .sort-btn {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #3498db;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-5px);
            }
        }

        .sort-btn:hover {
            animation: bounce 0.3s forwards;
        }

        .sort-btn.active {
            background: #3498db;
            color: white;

        }

        .sort-btn.inactive {
            background: white;
            color: #3498db;
        }

        .sort-btn:hover {
            background: #2980b9;
            color: white;
            border-color: #2980b9;
        }
    </style>
</head>

<body class="diary-page">
    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="container navbar-container">
                <a href="/" class="logo">
                    <i class="fas fa-map-marked-alt"></i> 个性化旅游系统
                </a>
                <ul class="nav-links">
                    <li><a href="/" class="home-link"><i class="fas fa-home"></i> 首页</a></li>
                    <li><a href="/recommend"><i class="fas fa-star"></i> 旅游推荐</a></li>
                    <li><a href="/diary" @click.prevent="checkLoginAndGo($event, '/diary')"><i class="fas fa-book"></i>
                            日记管理</a></li>
                    <li v-if="!isLoggedIn" class="user-auth-links">
                        <a href="/login"><i class="fas fa-sign-in-alt"></i> 登录</a>
                        <a href="/register"><i class="fas fa-user-plus"></i> 注册</a>
                    </li>
                    <li v-else class="user-auth-links">
                        <span style="margin-right: 15px; color: #3498db; font-weight: 500;">欢迎，{$ userName $}</span>
                        <a href="/logout" @click.prevent="handleLogout"><i class="fas fa-sign-out-alt"></i> 退出</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- 页面标题 -->
        <section class="page-header">
            <div class="container">
                <h1>📖 日记社区</h1>
                <p>记录旅行点滴，分享美好瞬间 — 所有日记公开可见</p>
            </div>
        </section>

        <!-- 内容区 -->
        <section class="content">
            <div class="container">
                <div class="diary-container">
                    <!-- 日记表单 -->
                    <div class="diary-form">
                        <h2>创建/编辑日记</h2>
                        <input type="hidden" :value="currentDiaryId || ''">
                        <div class="form-group">
                            <label>标题:</label>
                            <input type="text" v-model="formTitle" placeholder="请输入日记标题">
                        </div>
                        <div class="form-group">
                            <label>内容:</label>
                            <textarea v-model="formContent" placeholder="请输入日记内容"></textarea>
                        </div>
                        <button class="btn btn-primary" @click="saveDiary"
                            style="width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s; background-color: #3498db; color: white;">保存日记</button>
                        <button class="btn btn-secondary" @click="clearForm"
                            style="width: 100%; margin-top: 10px; padding: 12px; border: 1px solid #3498db; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s; background-color: white; color: #3498db;">清空</button>
                    </div>

                    <!-- 日记列表 -->
                    <div class="diary-list">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h2 style="text-wrap: nowrap">日记</h2>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <button :class="['sort-btn', currentSort === 'popularity' ? 'active' : 'inactive']"
                                    @click="changeSort('popularity')">
                                    <i class="fas fa-fire"></i>
                                    <span style="text-wrap: nowrap"> 热度</span>
                                </button>
                                <button :class="['sort-btn', currentSort === 'time' ? 'active' : 'inactive']"
                                    @click="changeSort('time')">
                                    <i class="fas fa-clock"></i>
                                    <span style="text-wrap: nowrap"> 时间</span>
                                </button>
                                <button class="btn btn-primary" @click="exportDiary"><i class="fas fa-download"></i>
                                    导出日记</button>
                                <input type="file" ref="importFileInput" style="display: none;" accept=".json"
                                    @change="handleImportFile">
                                <button class="btn btn-primary" @click="$refs.importFileInput.click()"><i
                                        class="fas fa-upload"></i> 导入日记</button>
                                <button class="btn"
                                    style="padding: 10px 16px; font-size: 14px; background-color: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer;"
                                    @click="downloadAllVideos"><i class="fas fa-sync"></i> 下载所有视频</button>
                            </div>
                        </div>
                        <div v-if="loading" class="loading">
                            <i class="fas fa-spinner"></i>
                            <p>加载中...</p>
                        </div>
                        <template v-else-if="diaries.length > 0">
                            <div v-for="diary in diaries" :key="diary.global_id" class="diary-item">
                                <div class="diary-header">
                                    <h3>{$ diary.title $}</h3>
                                    <div class="diary-actions">
                                        <!-- 自己写的日记才能编辑/删除/生成视频 -->
                                        <template v-if="diary.username === userName">
                                            <button class="btn btn-secondary"
                                                style="color: #3498db; border-color: #3498db"
                                                @click="editDiary(diary)">编辑</button>
                                            <button class="btn btn-danger" @click="deleteDiary(diary.id)">删除</button>
                                            <button v-if="diary.videos && diary.videos.length > 0" class="btn"
                                                style="padding: 8px 16px; font-size: 14px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;"
                                                @click="showVideo(diary)"><i class="fas fa-play"></i> 查看AI视频</button>
                                            <button v-else class="btn"
                                                style="padding: 8px 16px; font-size: 14px; background-color: #9b59b6; color: white; border: none; border-radius: 4px; cursor: pointer;"
                                                @click="generateVideo(diary)"><i class="fas fa-video"></i>
                                                生成AI视频</button>
                                        </template>
                                        <!-- 别人写的日记如果有视频也能看 -->
                                        <template v-else>
                                            <button v-if="diary.videos && diary.videos.length > 0" class="btn"
                                                style="padding: 8px 16px; font-size: 14px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;"
                                                @click="showVideo(diary)"><i class="fas fa-play"></i> 查看AI视频</button>
                                        </template>
                                    </div>
                                </div>
                                <div class="diary-meta">
                                    <span :class="['author-badge', diary.username === userName ? 'self' : 'other']">
                                        <i class="fas fa-user"></i> {$ diary.username $}
                                        <span v-if="diary.username === userName"> (我)</span>
                                    </span>
                                    <span style="margin: 0 12px; color: #bdc3c7;">|</span>
                                    <i class="fas fa-calendar"></i> {$ diary.date || '' $}
                                    <span style="margin: 0 12px; color: #bdc3c7;">|</span>
                                    <i class="fas fa-clock"></i> {$ diary.created_at || '' $}
                                    <span v-if="currentSort === 'popularity'"
                                        style="margin-left: 12px; color: #e74c3c;">
                                        <i class="fas fa-fire"></i> 热度: {$ diary.popularity || 0 $}
                                    </span>
                                    <span v-if="diary.videos && diary.videos.length > 0"
                                        style="margin-left: 15px; color: #27ae60;"><i class="fas fa-check-circle"></i>
                                        有视频</span>
                                </div>
                                <div class="diary-content">
                                    {$ diary.content.substring(0, 150) $}{$ diary.content.length > 150 ? '...' : '' $}
                                </div>
                                <!-- 点赞和评论按钮 -->
                                <div style="margin-top: 12px; display: flex; align-items: center; gap: 15px;">
                                    <button :class="['like-btn', getLikeState(diary.global_id).liked ? 'liked' : '']"
                                        @click="toggleLike(diary)">
                                        <i
                                            :class="getLikeState(diary.global_id).liked ? 'fas fa-heart' : 'far fa-heart'"></i>
                                        {$ getLikeState(diary.global_id).like_count || 0 $} 赞
                                    </button>
                                    <button class="btn"
                                        style="padding: 6px 14px; border: 1px solid #95a5a6; border-radius: 20px; background: white; color: #555; cursor: pointer; font-size: 14px; transition: all 0.2s;"
                                        @click="toggleCommentSection(diary)"
                                        @mouseover="event.target.style.borderColor='#3498db'; event.target.style.color='#3498db';"
                                        @mouseout="event.target.style.borderColor='#95a5a6'; event.target.style.color='#555';">
                                        <i class="far fa-comment"></i> 评论
                                    </button>
                                </div>

                                <!-- 评论区域 -->
                                <div :id="'comment-section-' + diary.global_id" class="comment-section"
                                    style="display: none;">
                                    <!-- 评论列表 -->
                                    <div class="comment-list">
                                        <div v-if="!getComments(diary.global_id) || getComments(diary.global_id).length === 0"
                                            style="text-align: center; color: #95a5a6; padding: 15px;">
                                            暂无评论，来说点什么吧
                                        </div>
                                        <div v-for="c in getComments(diary.global_id)" :key="c.id" class="comment-item">
                                            <div style="flex: 1;">
                                                <div class="comment-user">
                                                    {$ c.username $}
                                                    <span v-if="c.username === diary.username"
                                                        class="is-author">作者</span>
                                                </div>
                                                <div class="comment-content">{$ c.content $}</div>
                                                <div class="comment-time">{$ c.created_at $}</div>
                                            </div>
                                            <button v-if="c.username === userName" class="comment-delete-btn"
                                                @click="deleteComment(diary.global_id, c.id)" title="删除评论">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <!-- 评论输入 -->
                                    <div class="comment-input-row">
                                        <input type="text" class="comment-input"
                                            :id="'comment-input-' + diary.global_id" placeholder="写下你的评论..."
                                            @keyup.enter="submitComment(diary)">
                                        <button class="comment-submit-btn" @click="submitComment(diary)">
                                            <i class="fas fa-paper-plane"></i> 发送
                                        </button>
                                    </div>
                                </div>

                                <!-- 视频展示区域 -->
                                <div :id="'video-section-' + diary.global_id"
                                    style="display: none; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                                </div>
                            </div>
                        </template>
                        <p v-else style="text-align: center; color: #7f8c8d; padding: 50px;">暂无日记，开始创建吧！</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 登录提示弹窗 -->
        <div v-if="showLoginModal" class="login-modal-overlay" @click.self="showLoginModal = false">
            <div class="login-modal-box">
                <div class="login-modal-icon"><i class="fas fa-lock"></i></div>
                <div class="login-modal-title">请先登录</div>
                <div class="login-modal-desc">您需要登录后才能访问该功能页面</div>
                <div class="login-modal-buttons">
                    <button class="login-modal-btn-cancel" @click="showLoginModal = false">取消</button>
                    <button class="login-modal-btn-primary" @click="goToLogin">去登录</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        const { createApp, ref, reactive, onMounted } = Vue

        const app = createApp({
            delimiters: ['{$', '$}'],
            setup() {
                const isLoggedIn = ref(false)
                const userName = ref('')
                const showLoginModal = ref(false)
                const pendingUrl = ref('')
                const loading = ref(false)
                const currentDiaryId = ref(null)
                const formTitle = ref('')
                const formContent = ref('')
                const diaries = ref([])
                const importFileInput = ref(null)

                // 点赞状态: { global_id: { liked: bool, like_count: int } }
                const likeStates = reactive({})
                // 评论缓存: { global_id: [comments] }
                const commentsCache = reactive({})
                // 评论展开状态
                const commentExpanded = reactive({})
                // 当前排序方式
                const currentSort = ref('time')

                // ==================== 用户状态 ====================

                async function checkUserStatus() {
                    try {
                        const response = await fetch('/api/user/status')
                        const data = await response.json()
                        if (data.logged_in) {
                            isLoggedIn.value = true
                            userName.value = data.user_name
                        }
                    } catch (e) { }
                }

                async function handleLogout() {
                    try {
                        await fetch('/logout', { method: 'GET' })
                        window.location.href = '/'
                    } catch (e) {
                        window.location.href = '/logout'
                    }
                }

                async function checkLoginAndGo(event, url) {
                    if (isLoggedIn.value) { window.location.href = url; return }
                    try {
                        const response = await fetch('/api/user/status')
                        const data = await response.json()
                        if (data.logged_in) {
                            isLoggedIn.value = true
                            userName.value = data.user_name
                            window.location.href = url
                        } else {
                            pendingUrl.value = url
                            showLoginModal.value = true
                        }
                    } catch (e) {
                        pendingUrl.value = url
                        showLoginModal.value = true
                    }
                }

                function goToLogin() {
                    showLoginModal.value = false
                    sessionStorage.setItem('redirectAfterLogin', pendingUrl.value)
                    window.location.href = '/login'
                }

                // ==================== 日记 CRUD ====================

                async function fetchDiaries() {
                    loading.value = true
                    try {
                        const response = await fetch(`/api/diary?sort=${currentSort.value}`)
                        diaries.value = await response.json()
                        // 批量获取点赞状态
                        await fetchLikeStates()
                        // 重置评论缓存（保留已加载的评论）
                    } catch (e) {
                        console.error('获取日记列表失败:', e)
                    } finally {
                        loading.value = false
                    }
                }

                async function changeSort(sortType) {
                    if (currentSort.value === sortType) return
                    currentSort.value = sortType
                    await fetchDiaries()
                }

                async function saveDiary() {
                    if (!formTitle.value || !formContent.value) {
                        alert('请填写标题和内容')
                        return
                    }
                    try {
                        if (currentDiaryId.value) {
                            await fetch('/api/diary', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ id: currentDiaryId.value, title: formTitle.value, content: formContent.value })
                            })
                        } else {
                            await fetch('/api/diary', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ title: formTitle.value, content: formContent.value })
                            })
                        }
                        clearForm()
                        await fetchDiaries()
                    } catch (e) {
                        console.error('保存日记失败:', e)
                        alert('保存日记失败，请重试')
                    }
                }

                function editDiary(diary) {
                    currentDiaryId.value = diary.id
                    formTitle.value = diary.title
                    formContent.value = diary.content
                    window.scrollTo({ top: 0, behavior: 'smooth' })
                }

                async function deleteDiary(id) {
                    if (!confirm('确定要删除这篇日记吗？')) return
                    try {
                        await fetch(`/api/diary?id=${id}`, { method: 'DELETE' })
                        await fetchDiaries()
                    } catch (e) {
                        console.error('删除日记失败:', e)
                        alert('删除日记失败，请重试')
                    }
                }

                function clearForm() {
                    currentDiaryId.value = null
                    formTitle.value = ''
                    formContent.value = ''
                }

                // ==================== 点赞 ====================

                async function fetchLikeStates() {
                    const gids = diaries.value.map(d => d.global_id).filter(Boolean)
                    if (gids.length === 0) return
                    try {
                        const response = await fetch('/api/diary/likes/batch', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ global_ids: gids })
                        })
                        const data = await response.json()
                        if (data.likes) {
                            Object.entries(data.likes).forEach(([gid, state]) => {
                                likeStates[gid] = state
                            })
                        }
                    } catch (e) {
                        console.error('获取点赞状态失败:', e)
                    }
                }

                function getLikeState(globalId) {
                    return likeStates[globalId] || { liked: false, like_count: 0 }
                }

                async function toggleLike(diary) {
                    const gid = diary.global_id
                    try {
                        const response = await fetch(`/api/diary/${gid}/like`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' }
                        })
                        const data = await response.json()
                        if (data.success) {
                            likeStates[gid] = { liked: data.liked, like_count: data.like_count }
                        }
                    } catch (e) {
                        console.error('点赞失败:', e)
                    }
                }

                // ==================== 评论 ====================

                function getComments(globalId) {
                    return commentsCache[globalId] || []
                }

                function getCommentCount(globalId) {
                    return (commentsCache[globalId] || []).length
                }

                async function loadComments(globalId) {
                    try {
                        const response = await fetch(`/api/diary/${globalId}/comments`)
                        const data = await response.json()
                        commentsCache[globalId] = data.comments || []
                    } catch (e) {
                        console.error('加载评论失败:', e)
                    }
                }

                async function toggleCommentSection(diary) {
                    const gid = diary.global_id
                    const section = document.getElementById(`comment-section-${gid}`)

                    if (section.style.display === 'none' || !section.style.display) {
                        section.style.display = 'block'
                        // 加载评论
                        if (!commentsCache[gid]) {
                            await loadComments(gid)
                        }
                        commentExpanded[gid] = true
                        // 聚焦输入框
                        setTimeout(() => {
                            const input = document.getElementById(`comment-input-${gid}`)
                            if (input) input.focus()
                        }, 100)
                    } else {
                        section.style.display = 'none'
                        commentExpanded[gid] = false
                    }
                }

                async function submitComment(diary) {
                    const gid = diary.global_id
                    const input = document.getElementById(`comment-input-${gid}`)
                    if (!input) return
                    const content = input.value.trim()
                    if (!content) return

                    try {
                        const response = await fetch(`/api/diary/${gid}/comments`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ content: content })
                        })
                        const data = await response.json()
                        if (data.success) {
                            input.value = ''
                            // 重新加载评论
                            await loadComments(gid)
                        } else {
                            alert(data.error || '评论失败')
                        }
                    } catch (e) {
                        console.error('评论失败:', e)
                        alert('评论失败，请重试')
                    }
                }

                async function deleteComment(globalId, commentId) {
                    if (!confirm('确定要删除这条评论吗？')) return
                    try {
                        const response = await fetch(`/api/diary/${globalId}/comments/${commentId}`, {
                            method: 'DELETE'
                        })
                        const data = await response.json()
                        if (data.success) {
                            await loadComments(globalId)
                        } else {
                            alert(data.error || '删除失败')
                        }
                    } catch (e) {
                        console.error('删除评论失败:', e)
                    }
                }

                // ==================== 导出/导入 ====================

                async function exportDiary() {
                    try {
                        const response = await fetch('/api/diary/export')
                        const data = await response.json()
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
                        const url = URL.createObjectURL(blob)
                        const a = document.createElement('a')
                        a.href = url
                        a.download = `diary_export_${new Date().toISOString().split('T')[0]}.json`
                        document.body.appendChild(a)
                        a.click()
                        document.body.removeChild(a)
                        URL.revokeObjectURL(url)
                    } catch (e) {
                        console.error('导出日记失败:', e)
                        alert('导出日记失败，请重试')
                    }
                }

                async function handleImportFile(event) {
                    const file = event.target.files[0]
                    if (!file) return
                    try {
                        const reader = new FileReader()
                        reader.onload = async function (e) {
                            try {
                                const data = JSON.parse(e.target.result)
                                const response = await fetch('/api/diary/import', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(data)
                                })
                                const result = await response.json()
                                if (result.success) {
                                    alert(`成功导入 ${result.imported} 篇日记`)
                                    await fetchDiaries()
                                } else {
                                    alert('导入失败: ' + (result.error || '未知错误'))
                                }
                            } catch (err) {
                                console.error('解析JSON文件失败:', err)
                                alert('请选择有效的JSON文件')
                            }
                        }
                        reader.readAsText(file)
                    } catch (e) {
                        console.error('导入日记失败:', e)
                        alert('导入日记失败，请重试')
                    }
                    event.target.value = ''
                }

                // ==================== AI视频 ====================

                async function generateVideo(diary) {
                    const videoSection = document.getElementById(`video-section-${diary.global_id}`);

                    if (videoSection.style.display === 'none' || !videoSection.style.display) {
                        videoSection.style.display = 'block';
                        videoSection.innerHTML = '<div style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #9b59b6;"></i><p style="margin-top: 10px; color: #7f8c8d;">正在提交视频生成任务...</p></div>';

                        try {
                            const response = await fetch('/api/video/generate/ai', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ diary_id: diary.id, aspect_ratio: '16:9' })
                            });

                            const result = await response.json();

                            if (result.success && result.task_id) {
                                videoSection.innerHTML = '<div style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #9b59b6;"></i><p style="margin-top: 10px; color: #7f8c8d;">视频生成中，请稍候（通常需要1-2分钟）...</p><p style="color: #95a5a6; font-size: 12px; margin-top: 5px;">任务ID: ' + result.task_id.substring(0, 10) + '...</p></div>';
                                pollVideoStatus(result.task_id, diary, videoSection);
                            } else {
                                let errorMsg = result.error || '未知错误';
                                let hint = '提示：请确保已正确配置火山引擎API密钥';
                                let detailSteps = '';
                                if (result.code === 50400 || (result.error && result.error.includes('Access Denied'))) {
                                    errorMsg = '火山引擎API访问被拒绝 (Access Denied)';
                                    hint = '请按以下步骤排查：';
                                    detailSteps = `
                                        <ol style="text-align: left; max-width: 400px; margin: 10px auto; color: #7f8c8d; font-size: 13px; line-height: 1.8;">
                                            <li>确认已注册<a href="https://console.volcengine.com/" target="_blank" style="color: #3498db;">火山引擎账号</a>并实名认证</li>
                                            <li>前往<a href="https://console.volcengine.com/visual/experience" target="_blank" style="color: #3498db;">视觉智能-即梦AI</a>开通服务</li>
                                            <li>在<a href="https://console.volcengine.com/iam/keymanage" target="_blank" style="color: #3498db;">IAM密钥管理</a>中确认AccessKey已启用</li>
                                            <li>确保IAM用户/角色已授予 <b>VisualService</b> 相关权限</li>
                                            <li>检查.env文件中的 AccessKey 和 SecretKey 是否正确复制</li>
                                        </ol>
                                    `;
                                } else if (result.code === 50430) {
                                    errorMsg = 'API并发限制';
                                    hint = '提示：即梦3.0通常限制并发任务数量，请等待其他任务完成后重试';
                                }
                                videoSection.innerHTML = `
                                    <div style="text-align: center; padding: 20px; color: #e74c3c;">
                                        <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
                                        <h4>任务提交失败</h4>
                                        <p style="color: #7f8c8d; margin-top: 10px;">${errorMsg}</p>
                                        <p style="color: #95a5a6; font-size: 12px; margin-top: 15px;">${hint}</p>
                                        ${detailSteps}
                                    </div>
                                `;
                            }
                        } catch (error) {
                            console.error('提交视频任务失败:', error);
                            videoSection.innerHTML = `
                                <div style="text-align: center; padding: 20px; color: #e74c3c;">
                                    <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
                                    <h4>提交失败</h4>
                                    <p style="color: #7f8c8d; margin-top: 10px;">网络错误，请检查网络连接</p>
                                </div>
                            `;
                        }
                    } else {
                        videoSection.style.display = 'none';
                    }
                }

                async function pollVideoStatus(taskId, diary, videoSection) {
                    const maxAttempts = 60;
                    let attempts = 0;

                    while (attempts < maxAttempts) {
                        try {
                            const response = await fetch('/api/video/query/ai', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ task_id: taskId, diary_id: diary.id })
                            });

                            const result = await response.json();

                            if (result.success) {
                                if (result.status === 'completed' && result.video_url) {
                                    displayAIVideo(videoSection, result);
                                    await fetchDiaries();
                                    return;
                                } else if (result.status === 'failed') {
                                    videoSection.innerHTML = `
                                        <div style="text-align: center; padding: 20px; color: #e74c3c;">
                                            <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
                                            <h4>视频生成失败</h4>
                                            <p style="color: #7f8c8d; margin-top: 10px;">${result.error || '未知错误'}</p>
                                        </div>
                                    `;
                                    return;
                                }
                            }
                        } catch (error) {
                            console.error('查询视频状态失败:', error);
                        }

                        attempts++;
                        const progress = Math.min(Math.round((attempts / maxAttempts) * 100), 95);
                        videoSection.innerHTML = `<div style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #9b59b6;"></i><p style="margin-top: 10px; color: #7f8c8d;">视频生成中，请稍候（通常需要1-2分钟）...</p><div style="margin-top: 15px; width: 200px; margin-left: auto; margin-right: auto;"><div style="background-color: #ecf0f1; border-radius: 4px; height: 8px; overflow: hidden;"><div style="background-color: #9b59b6; height: 100%; width: ${progress}%; transition: width 0.5s;"></div></div></div><p style="color: #95a5a6; font-size: 12px; margin-top: 10px;">任务ID: ${taskId.substring(0, 10)}... | 第 ${attempts} 次查询</p></div>`;
                        await new Promise(resolve => setTimeout(resolve, 5000));
                    }

                    videoSection.innerHTML = `
                        <div style="text-align: center; padding: 20px; color: #e67e22;">
                            <i class="fas fa-clock" style="font-size: 48px; margin-bottom: 15px;"></i>
                            <h4>视频生成超时</h4>
                            <p style="color: #7f8c8d; margin-top: 10px;">视频生成时间较长，请稍后手动刷新页面查看</p>
                        </div>
                    `;
                }

                function displayAIVideo(container, result) {
                    const videoUrl = result.video_url || '';
                    const generatedAt = result.generated_at || new Date().toLocaleString();

                    container.innerHTML = `
                        <div style="margin-bottom: 15px;">
                            <h4 style="margin-bottom: 10px; color: #2c3e50;"><i class="fas fa-magic" style="color: #9b59b6;"></i> 即梦AI生成视频</h4>
                            <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 15px;">基于日记内容生成的AI视频</p>
                        </div>
                        <div style="background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                            <div style="margin-bottom: 10px;">
                                <span style="background: #9b59b6; color: white; padding: 3px 10px; border-radius: 3px; font-size: 12px;">
                                    <i class="fas fa-check-circle"></i> 生成成功
                                </span>
                                <span style="margin-left: 10px; color: #95a5a6; font-size: 12px;">生成时间: ${generatedAt}</span>
                            </div>
                            <video width="100%" controls style="border-radius: 8px; margin-bottom: 10px; background: #000;">
                                <source src="${encodeURI(videoUrl)}" type="video/mp4">
                                您的浏览器不支持视频播放
                            </video>
                            <div style="margin-top: 10px; text-align: center;">
                                <a href="${encodeURI(videoUrl)}" target="_blank" style="color: #3498db; text-decoration: none; font-size: 14px;">
                                    <i class="fas fa-external-link-alt"></i> 在新窗口打开视频
                                </a>
                            </div>
                        </div>
                    `;
                }

                async function showVideo(diary) {
                    const videoSection = document.getElementById(`video-section-${diary.global_id}`);

                    if (videoSection.style.display === 'none' || !videoSection.style.display) {
                        videoSection.style.display = 'block';

                        if (diary.videos && diary.videos.length > 0) {
                            const latestVideo = diary.videos[diary.videos.length - 1];
                            displaySavedVideo(videoSection, latestVideo);
                        } else {
                            videoSection.innerHTML = '<p style="text-align: center; color: #7f8c8d;">暂无已生成的视频</p>';
                        }
                    } else {
                        videoSection.style.display = 'none';
                    }
                }

                function displaySavedVideo(container, video) {
                    const videoUrl = video.video_url || '';
                    const generatedAt = video.generated_at || '';

                    container.innerHTML = `
                        <div style="margin-bottom: 15px;">
                            <h4 style="margin-bottom: 10px; color: #2c3e50;"><i class="fas fa-play-circle" style="color: #27ae60;"></i> AI生成视频</h4>
                        </div>
                        <div style="background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                            <div style="margin-bottom: 10px;">
                                <span style="background: #27ae60; color: white; padding: 3px 10px; border-radius: 3px; font-size: 12px;">
                                    <i class="fas fa-check-circle"></i> 已保存
                                </span>
                                <span style="margin-left: 10px; color: #95a5a6; font-size: 12px;">生成时间: ${generatedAt}</span>
                            </div>
                            <video width="100%" controls style="border-radius: 8px; margin-bottom: 10px; background: #000;">
                                <source src="${encodeURI(videoUrl)}" type="video/mp4">
                                您的浏览器不支持视频播放
                            </video>
                            <div style="margin-top: 10px; text-align: center;">
                                <a href="${encodeURI(videoUrl)}" target="_blank" style="color: #3498db; text-decoration: none; font-size: 14px;">
                                    <i class="fas fa-external-link-alt"></i> 在新窗口打开视频
                                </a>
                            </div>
                        </div>
                    `;
                }

                async function downloadAllVideos() {
                    if (!confirm('确定要下载所有远程视频吗？请耐心等待...')) return;
                    try {
                        const response = await fetch('/api/video/download/all-videos', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        const result = await response.json();
                        if (result.success) {
                            alert(result.no_need ? '所有视频已是本地视频，无需下载' : result.message);
                            await fetchDiaries();
                        } else {
                            alert('下载失败: ' + (result.error || '未知错误'));
                        }
                    } catch (error) {
                        console.error('下载所有视频失败:', error);
                        alert('下载所有视频失败，请重试');
                    }
                }

                // ==================== 初始化 ====================

                onMounted(() => {
                    checkUserStatus()
                    fetchDiaries()
                })

                return {
                    isLoggedIn, userName, showLoginModal, loading, currentDiaryId, formTitle, formContent,
                    diaries, importFileInput, likeStates, commentsCache, commentExpanded, currentSort,
                    checkUserStatus, handleLogout, checkLoginAndGo, goToLogin,
                    fetchDiaries, changeSort, saveDiary, editDiary, deleteDiary, clearForm,
                    exportDiary, handleImportFile,
                    getLikeState, toggleLike,
                    getComments, getCommentCount, toggleCommentSection, submitComment, deleteComment,
                    generateVideo, showVideo, downloadAllVideos
                }
            }
        })

        app.mount('#app')
    </script>
</body>

</html>
